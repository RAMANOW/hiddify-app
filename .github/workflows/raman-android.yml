# Raman VPN: builds the Android APKs (universal and one per ABI) and, for a tag or when asked,
# publishes them as a GitHub release. Without a signing key in the repo secrets the APKs are signed
# with the debug key (android/app/build.gradle falls back to it), which installs fine.
#
# The core library is the official hiddify-core release that dependencies.properties pins
# (downloaded by `make android-apk-prepare`, as upstream does). Its built-in Psiphon config is what
# Shield connects with.
#
# Job "relay" builds libmhrv_rs.so (mhrv-rs, MIT: the Google Apps Script relay of the
# "رله گوگل" tab) from the tag pinned in raman/relay/, cached by those files.
#
# Job "dnstunnel" builds the engines of the "DNS قطعی" tab as Android executables
# (libsoarsocks.so: raman/dnstunnel/soarsocks over getlantern/soar, Apache-2.0; libcottendns.so: the
# CottenDNS client, MIT; 1.8.2: libdnstt.so: dnstt-client, public domain / CC0; libmasterdns.so: the
# MasterDnsVPN client, MIT; libslipstream.so: the Slipstream client, Apache-2.0, C), each from the
# version pinned in raman/dnstunnel/, cached by raman/dnstunnel/**.
#
# Experimental, opt-in (input custom-core, default off): job "core" builds hiddify-core from source
# with the patches of raman/core-patches (raman/core/build-core.sh) so Shield could pass its own
# Psiphon settings. That build embeds a Psiphon config only from the HIDDIFY_SECRET_KEY and
# PSIPHON_CONFIG secrets (a config issued to this project by Psiphon Inc.); without them Shield has
# no Psiphon config and does not work, so do not use it for a release until those exist.
name: Raman VPN Android

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Publish a GitHub release with this tag ('none' = build only; an empty value falls back to this default)
        type: string
        default: 'v1.8.2-raman'
      custom-core:
        description: 'Experimental: build the core from source with the Raman patches (needs the PSIPHON_CONFIG and HIDDIFY_SECRET_KEY secrets, otherwise Shield breaks)'
        type: boolean
        default: false
      inproxy:
        description: With custom-core, build it with Psiphon in-proxy (Conduit) support
        type: boolean
        default: true
  push:
    branches: [main]
    tags: ['v*-raman*']
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: raman-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# CHANNEL (the Makefile's: prod = the released core and lib/main_prod.dart) is set on the make
# steps only: flutter-action reads a CHANNEL variable of its own.
jobs:
  core:
    # opt-in only: a push or a dispatch without custom-core uses the official core
    if: github.event_name == 'workflow_dispatch' && inputs.custom-core
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      INPROXY: ${{ inputs.inproxy }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache key
        id: key
        run: |
          echo "core=raman-core-${{ hashFiles('dependencies.properties', 'raman/core/**', 'raman/core-patches/**') }}-inproxy-$INPROXY" >> "$GITHUB_OUTPUT"

      - name: Cached core
        id: cache
        uses: actions/cache@v4
        with:
          path: build/core/hiddify-core.aar
          key: ${{ steps.key.outputs.core }}

      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: hiddify-core's Go version
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          v=$(sed -n 's/^core.version=//p' dependencies.properties)
          mkdir -p "$RUNNER_TEMP/core-gomod"
          curl -fsSL "https://raw.githubusercontent.com/hiddify/hiddify-core/v$v/go.mod" -o "$RUNNER_TEMP/core-gomod/go.mod"
          grep -E '^(go|toolchain) ' "$RUNNER_TEMP/core-gomod/go.mod"

      - name: Set up Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/core-gomod/go.mod
          cache: false

      - name: Set up Java
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up the Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Clone hiddify-core and apply the Raman patches
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          STEP: clone
        run: bash raman/core/build-core.sh

      - name: Check the patched Psiphon outbound
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          STEP: check
        run: bash raman/core/build-core.sh

      - name: Build hiddify-core.aar
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          STEP: build
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          # optional: a Psiphon config of your own (otherwise none is embedded)
          HIDDIFY_SECRET_KEY: ${{ secrets.HIDDIFY_SECRET_KEY }}
          PSIPHON_CONFIG: ${{ secrets.PSIPHON_CONFIG }}
        run: bash raman/core/build-core.sh

      - name: Upload the core
        uses: actions/upload-artifact@v4
        with:
          name: hiddify-core-aar
          path: build/core/hiddify-core.aar
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  relay:
    # Google Relay (رله گوگل): libmhrv_rs.so of mhrv-rs (MIT), pinned in raman/relay/MHRV_*
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache key
        id: key
        run: echo "relay=raman-relay-${{ hashFiles('raman/relay/**') }}" >> "$GITHUB_OUTPUT"

      - name: Cached relay libraries
        id: cache
        uses: actions/cache@v4
        with:
          path: build/relay-jni
          key: ${{ steps.key.outputs.relay }}

      - name: Set up Rust
        if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up the Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Install cargo-ndk
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Build libmhrv_rs.so
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash raman/relay/build-relay.sh

      - name: Upload the relay libraries
        uses: actions/upload-artifact@v4
        with:
          name: relay-jni
          path: build/relay-jni
          retention-days: 30
          if-no-files-found: error

  dnstunnel:
    # DNS قطعی engines: Soar (Apache-2.0), CottenDNS (MIT), dnstt (CC0), MasterDnsVPN (MIT), Slipstream (Apache-2.0)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache key
        id: key
        run: echo "dns=raman-dnstunnel-${{ hashFiles('raman/dnstunnel/**') }}" >> "$GITHUB_OUTPUT"

      - name: Cached engines
        id: cache
        uses: actions/cache@v4
        with:
          path: build/dnstunnel-jni
          key: ${{ steps.key.outputs.dns }}

      - name: Set up Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Set up the Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Build the DNS tunnel engines
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash raman/dnstunnel/build-dnstunnel.sh

      - name: Build the Slipstream client
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          pip install --user meson ninja
          export PATH="$HOME/.local/bin:$PATH"
          bash raman/dnstunnel/build-slipstream.sh

      - name: Upload the engines
        uses: actions/upload-artifact@v4
        with:
          name: dnstunnel-jni
          path: build/dnstunnel-jni
          retention-days: 30
          if-no-files-found: error

  android:
    needs: [core, relay, dnstunnel]
    # runs after the custom core, or without it when that job is skipped; needs the relay and DNS
    # tunnel libraries
    if: ${{ !failure() && !cancelled() && needs.relay.result == 'success' && needs.dnstunnel.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - name: Install build tools
        run: |
          make android-apk-install-deps
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Get packages, generate code, download the core library
        env:
          CHANNEL: prod
        run: make android-apk-prepare

      - name: Use the custom Raman core (experimental, opt-in)
        if: needs.core.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: hiddify-core-aar
          path: android/app/libs

      - name: Google Relay libraries (libmhrv_rs.so)
        uses: actions/download-artifact@v4
        with:
          name: relay-jni
          path: build/relay-jni

      - name: Add the relay libraries to the app
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p android/app/src/main/jniLibs/$abi
            cp build/relay-jni/$abi/libmhrv_rs.so android/app/src/main/jniLibs/$abi/
          done
          ls -laR android/app/src/main/jniLibs

      - name: DNS tunnel engines (libsoarsocks, libcottendns, libdnstt, libmasterdns, libslipstream)
        uses: actions/download-artifact@v4
        with:
          name: dnstunnel-jni
          path: build/dnstunnel-jni

      - name: Add the DNS tunnel engines to the app
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p android/app/src/main/jniLibs/$abi
            for lib in libsoarsocks libcottendns libdnstt libmasterdns libslipstream; do
              cp build/dnstunnel-jni/$abi/$lib.so android/app/src/main/jniLibs/$abi/
            done
            chmod 755 android/app/src/main/jniLibs/$abi/*.so
          done
          ls -laR android/app/src/main/jniLibs

      - name: Check the core
        run: |
          ls -la android/app/libs
          for aar in android/app/libs/*.aar; do unzip -l "$aar" | grep -E 'jni/|classes.jar'; done

      - name: Optional signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 --decode > android/key.jks
            printf '%s=%s\n' storeFile "$PWD/android/key.jks" storePassword "$STORE_PASSWORD" \
              keyPassword "$KEY_PASSWORD" keyAlias "$KEY_ALIAS" > android/key.properties
            echo "release signing key set up"
          else
            echo "no signing key: the APKs are signed with the debug key"
          fi

      - name: Build the APKs
        env:
          CHANNEL: prod
        run: make android-apk-release

      - name: Collect the APKs
        run: |
          mkdir -p out
          apk=build/app/outputs/flutter-apk
          ls -la $apk
          cp $apk/*arm64-v8a*release*.apk out/RamanVPN-Android-arm64.apk || echo "no arm64 apk"
          cp $apk/*armeabi-v7a*release*.apk out/RamanVPN-Android-arm7.apk || echo "no arm7 apk"
          cp $apk/*x86_64*release*.apk out/RamanVPN-Android-x86_64.apk || echo "no x64 apk"
          if [ -f $apk/app-release.apk ]; then cp $apk/app-release.apk out/RamanVPN-Android-universal.apk;
          else cp $apk/*universal*release*.apk out/RamanVPN-Android-universal.apk; fi
          ls -la out

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: RamanVPN-Android
          path: out
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release-tag != '' && inputs.release-tag != 'none')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release-tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
            gh release edit "$TAG" --notes-file raman/release-notes.md
          else
            gh release create "$TAG" out/*.apk --target "$GITHUB_SHA" --title "Raman VPN $TAG" --notes-file raman/release-notes.md
          fi
