# Raman VPN: builds the Android APKs (universal and one per ABI) and, for a tag or when asked,
# publishes them as a GitHub release. Without a signing key in the repo secrets the APKs are signed
# with the debug key (android/app/build.gradle falls back to it), which installs fine.
#
# The core library (hiddify-core.aar) is built from hiddify-core's source with the patches of
# raman/core-patches (job "core", raman/core/build-core.sh), not downloaded: the Raman patches let
# Shield pass its own Psiphon settings. It is cached by the hash of those files.
name: Raman VPN Android

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Publish a GitHub release with this tag (empty = build only)
        type: string
        default: 'v1.3.0-raman'
      inproxy:
        description: Build the core with Psiphon in-proxy (Conduit) support
        type: boolean
        default: true
  push:
    branches: [main]
    tags: ['v*-raman*']
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: raman-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# CHANNEL (the Makefile's: prod = the released core and lib/main_prod.dart) is set on the make
# steps only: flutter-action reads a CHANNEL variable of its own.
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      INPROXY: ${{ github.event_name != 'workflow_dispatch' || inputs.inproxy }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache key
        id: key
        run: |
          echo "core=raman-core-${{ hashFiles('dependencies.properties', 'raman/core/**', 'raman/core-patches/**') }}-inproxy-$INPROXY" >> "$GITHUB_OUTPUT"

      - name: Cached core
        id: cache
        uses: actions/cache@v4
        with:
          path: build/core/hiddify-core.aar
          key: ${{ steps.key.outputs.core }}

      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: hiddify-core's Go version
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          v=$(sed -n 's/^core.version=//p' dependencies.properties)
          mkdir -p "$RUNNER_TEMP/core-gomod"
          curl -fsSL "https://raw.githubusercontent.com/hiddify/hiddify-core/v$v/go.mod" -o "$RUNNER_TEMP/core-gomod/go.mod"
          grep -E '^(go|toolchain) ' "$RUNNER_TEMP/core-gomod/go.mod"

      - name: Set up Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/core-gomod/go.mod
          cache: false

      - name: Set up Java
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up the Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Clone hiddify-core and apply the Raman patches
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          STEP: clone
        run: bash raman/core/build-core.sh

      - name: Check the patched Psiphon outbound
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          STEP: check
        run: bash raman/core/build-core.sh

      - name: Build hiddify-core.aar
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          STEP: build
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          # optional: a Psiphon config of your own (otherwise none is embedded)
          HIDDIFY_SECRET_KEY: ${{ secrets.HIDDIFY_SECRET_KEY }}
          PSIPHON_CONFIG: ${{ secrets.PSIPHON_CONFIG }}
        run: bash raman/core/build-core.sh

      - name: Upload the core
        uses: actions/upload-artifact@v4
        with:
          name: hiddify-core-aar
          path: build/core/hiddify-core.aar
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  android:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - name: Install build tools
        run: |
          make android-apk-install-deps
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Get packages, generate code, download the core library
        env:
          CHANNEL: prod
        run: make android-apk-prepare

      - name: Use the Raman core
        uses: actions/download-artifact@v4
        with:
          name: hiddify-core-aar
          path: android/app/libs

      - name: Check the core
        run: |
          ls -la android/app/libs
          unzip -l android/app/libs/hiddify-core.aar | grep -E 'jni/|classes.jar'

      - name: Optional signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 --decode > android/key.jks
            printf '%s=%s\n' storeFile "$PWD/android/key.jks" storePassword "$STORE_PASSWORD" \
              keyPassword "$KEY_PASSWORD" keyAlias "$KEY_ALIAS" > android/key.properties
            echo "release signing key set up"
          else
            echo "no signing key: the APKs are signed with the debug key"
          fi

      - name: Build the APKs
        env:
          CHANNEL: prod
        run: make android-apk-release

      - name: Collect the APKs
        run: |
          mkdir -p out
          apk=build/app/outputs/flutter-apk
          ls -la $apk
          cp $apk/*arm64-v8a*release*.apk out/RamanVPN-Android-arm64.apk || echo "no arm64 apk"
          cp $apk/*armeabi-v7a*release*.apk out/RamanVPN-Android-arm7.apk || echo "no arm7 apk"
          cp $apk/*x86_64*release*.apk out/RamanVPN-Android-x86_64.apk || echo "no x64 apk"
          if [ -f $apk/app-release.apk ]; then cp $apk/app-release.apk out/RamanVPN-Android-universal.apk;
          else cp $apk/*universal*release*.apk out/RamanVPN-Android-universal.apk; fi
          ls -la out

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: RamanVPN-Android
          path: out
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release-tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release-tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          **Raman VPN (رامان VPN)** for Android — open source, licensed under the Hiddify Extended GPL v3 (see LICENSE.md). Non-commercial.

          - Two tabs: **Raman** (your profiles and configs) and **Shield** (one-tap connect through the Psiphon network, no server needed)
          - Shield: exit-country picker, use as extra security or unblocker for Raman profiles, per-app split tunneling, share the proxy on the local network
          - Disguise icon: show the app as Calculator, Weather, Notes or Clock (Settings)
          - New in 1.2: **Shield settings** (Shield tab → All Shield settings): Shield's own split tunneling (all / only selected / all except selected apps), upstream proxy (system or custom HTTP/SOCKS5 with username, password and NTLM domain), network sharing port, disable timeouts for slow networks, sound and vibration on connection changes, stealth notifications, open a website after connecting, language, disguise icon, always-on VPN shortcut
          - New in 1.3: **Shield connection settings**: connection protocol (Automatic / Direct / CDN fronting / Conduit volunteer relays), beast mode (more servers tried at once), Conduit pairing ID of your own relay with automatic fallback to public relays after 2–10 minutes, unsafe-traffic (malware) alerts as notifications
          - Smart DNS, network checker, Iran defaults

          The core library is built from [hiddify-core](https://github.com/hiddify/hiddify-core) 5.9.0 source with the patches in [`raman/core-patches`](https://github.com/RAMANOW/hiddify-app/tree/main/raman/core-patches) (Psiphon settings merged on top of the built-in Psiphon config), same license.

          Install `RamanVPN-Android-universal.apk` if you are not sure which one fits your phone. These APKs are signed with a different key from earlier releases: uninstall the old version first.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
          else
            gh release create "$TAG" out/*.apk --target "$GITHUB_SHA" --title "Raman VPN $TAG" --notes-file notes.md
          fi
